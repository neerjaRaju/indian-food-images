name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  builder:
    name: Builder (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: builder/requirements.txt

      - name: Install
        working-directory: builder
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint
        working-directory: builder
        run: ruff check ifca tests

      - name: Unit tests
        working-directory: builder
        run: python -m pytest tests -q

      # Proves the offline path still produces a usable database, and gives the
      # Flutter job a real asset to test against.
      - name: Build a database with no network sources
        working-directory: builder
        run: |
          python -m ifca build --offline --skip-images
          python -m ifca stats

      - uses: actions/upload-artifact@v4
        with:
          name: ci-database
          path: app/assets/db/
          retention-days: 3

  app:
    name: App (Flutter)
    needs: builder
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: ci-database
          path: app/assets/db

      - name: Install dependencies
        working-directory: app
        run: flutter pub get

      - name: Verify formatting
        working-directory: app
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Test
        working-directory: app
        run: flutter test --coverage

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Report APK size
        working-directory: app
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          SIZE=$(stat -c%s "$APK")
          echo "Debug APK: $((SIZE / 1024 / 1024)) MB" >> "$GITHUB_STEP_SUMMARY"

  size-budget:
    name: Release size budget
    needs: builder
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: ci-database
          path: app/assets/db

      - working-directory: app
        run: flutter pub get

      - name: Build release APK (debug signing)
        working-directory: app
        run: flutter build apk --release --split-per-abi

      # The whole point of storing image URLs instead of image bytes is a small
      # APK. If that regresses, the build should say so loudly.
      - name: Enforce the 100 MB APK budget
        working-directory: app
        run: |
          fail=0
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            size=$(stat -c%s "$apk")
            mb=$((size / 1024 / 1024))
            echo "$(basename "$apk"): ${mb} MB" >> "$GITHUB_STEP_SUMMARY"
            if [ "$mb" -gt 100 ]; then
              echo "::error::$(basename "$apk") is ${mb} MB, over the 100 MB budget"
              fail=1
            fi
          done
          exit $fail
