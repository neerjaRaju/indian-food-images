name: Release app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_aab:
        description: "Also build an Android App Bundle for Play"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ---------------------------------------------------------------
      # Database
      # ---------------------------------------------------------------

      - name: Fetch the latest published database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/assets/db

          if gh release download \
            --pattern 'indian_food.db.gz' \
            --dir app/assets/db 2>/dev/null; then

            gh release download \
              --pattern 'metadata.json' \
              --dir app/assets/db \
              --clobber || true

            echo "Bundled the latest released database."

          else
            echo "::warning::No published database release found; building one."

            python -m pip install -r builder/requirements.txt

            (
              cd builder
              python -m ifca build --offline --skip-images
              python -m ifca bundle
            )
          fi

          ls -lah app/assets/db

      # ---------------------------------------------------------------
      # Android signing
      # ---------------------------------------------------------------

      - name: Check Android signing configuration
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 is not configured."
            echo "Android build will use the project's default signing configuration."
          else
            echo "Android signing keystore is configured."
          fi

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p app/android/app

          echo "$KEYSTORE_BASE64" | base64 --decode > app/android/app/upload-keystore.jks

          test -s app/android/app/upload-keystore.jks

          cat > app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "Android signing configuration created."

      # ---------------------------------------------------------------
      # Flutter dependencies
      # ---------------------------------------------------------------

      - name: Flutter pub get
        working-directory: app
        run: flutter pub get

      # ---------------------------------------------------------------
      # Build APK
      # ---------------------------------------------------------------

      - name: Build split APKs
        working-directory: app
        env:
          ADMOB_BANNER: ${{ secrets.ADMOB_BANNER }}
          ADMOB_INTERSTITIAL: ${{ secrets.ADMOB_INTERSTITIAL }}
          ADMOB_REWARDED: ${{ secrets.ADMOB_REWARDED }}
          ADMOB_NATIVE: ${{ secrets.ADMOB_NATIVE }}
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --dart-define=ADMOB_BANNER="$ADMOB_BANNER" \
            --dart-define=ADMOB_INTERSTITIAL="$ADMOB_INTERSTITIAL" \
            --dart-define=ADMOB_REWARDED="$ADMOB_REWARDED" \
            --dart-define=ADMOB_NATIVE="$ADMOB_NATIVE"

      # ---------------------------------------------------------------
      # Build AAB
      # ---------------------------------------------------------------

      - name: Build App Bundle
        if: ${{ inputs.build_aab != false }}
        working-directory: app
        env:
          ADMOB_BANNER: ${{ secrets.ADMOB_BANNER }}
          ADMOB_INTERSTITIAL: ${{ secrets.ADMOB_INTERSTITIAL }}
          ADMOB_REWARDED: ${{ secrets.ADMOB_REWARDED }}
          ADMOB_NATIVE: ${{ secrets.ADMOB_NATIVE }}
        run: |
          flutter build appbundle \
            --release \
            --dart-define=ADMOB_BANNER="$ADMOB_BANNER" \
            --dart-define=ADMOB_INTERSTITIAL="$ADMOB_INTERSTITIAL" \
            --dart-define=ADMOB_REWARDED="$ADMOB_REWARDED" \
            --dart-define=ADMOB_NATIVE="$ADMOB_NATIVE"

      # ---------------------------------------------------------------
      # Size report
      # ---------------------------------------------------------------

      - name: Size report
        working-directory: app
        run: |
          {
            echo "## Artifact sizes"
            echo ""

            for f in \
              build/app/outputs/flutter-apk/*-release.apk \
              build/app/outputs/bundle/release/*.aab
            do
              [ -f "$f" ] || continue

              size=$(stat -c%s "$f")

              echo "- \`$(basename "$f")\` — $((size / 1024 / 1024)) MB"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------
      # GitHub Release
      # ---------------------------------------------------------------

      - name: Attach artifacts to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            2>/dev/null || true

          gh release upload "${GITHUB_REF_NAME}" \
            --clobber \
            app/build/app/outputs/flutter-apk/*-release.apk \
            app/build/app/outputs/bundle/release/*.aab

      # ---------------------------------------------------------------
      # GitHub Actions artifacts
      # ---------------------------------------------------------------

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            app/build/app/outputs/flutter-apk/*-release.apk
            app/build/app/outputs/bundle/release/*.aab
          retention-days: 30

      # ---------------------------------------------------------------
      # Cleanup signing material
      # ---------------------------------------------------------------

      - name: Remove signing files
        if: always()
        run: |
          rm -f app/android/app/upload-keystore.jks
          rm -f app/android/key.properties

          echo "Signing files removed."