name: Release app

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      build_aab:
        description: "Also build an Android App Bundle for Play"
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:

      # ===============================================================
      # CHECKOUT
      # ===============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ===============================================================
      # JAVA
      # ===============================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ===============================================================
      # FLUTTER
      # ===============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ===============================================================
      # DISABLE GRADLE FILE WATCHING
      # Fixes:
      # Caught exception: Already watching path
      # ===============================================================

      - name: Configure Gradle for CI
        run: |
          mkdir -p app/android

          cat > app/android/gradle.properties <<'EOF'
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          org.gradle.vfs.watch=false
          org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
          EOF

          echo "Gradle CI configuration:"
          cat app/android/gradle.properties

      # ===============================================================
      # DATABASE
      # ===============================================================

      - name: Fetch latest published database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/assets/db

          if gh release download \
            --pattern 'indian_food.db.gz' \
            --dir app/assets/db \
            2>/dev/null; then

            gh release download \
              --pattern 'metadata.json' \
              --dir app/assets/db \
              --clobber || true

            echo "Bundled the latest released database."

          else
            echo "::warning::No published database release found; building one."

            python -m pip install -r builder/requirements.txt

            (
              cd builder
              python -m ifca build --offline --skip-images
              python -m ifca bundle
            )
          fi

          echo "Database directory:"
          ls -lah app/assets/db

      # ===============================================================
      # ANDROID SIGNING
      # ===============================================================

      - name: Check Android signing configuration
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 is not configured."
            echo "Build will use default/debug signing if configured."
          else
            echo "Android signing keystore is configured."
          fi

      - name: Decode Android signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p app/android/app

          echo "$KEYSTORE_BASE64" | base64 --decode \
            > app/android/app/upload-keystore.jks

          test -s app/android/app/upload-keystore.jks

          cat > app/android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

          echo "Android signing configuration created."

          echo "Keystore:"
          ls -lh app/android/app/upload-keystore.jks

          echo "Alias:"
          keytool -list \
            -keystore app/android/app/upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Keystore validation successful."

      # ===============================================================
      # STOP GRADLE DAEMONS
      # ===============================================================

      - name: Stop Gradle
        working-directory: app/android
        run: |
          ./gradlew --stop || true

      # ===============================================================
      # FLUTTER CLEAN
      # ===============================================================

      - name: Flutter clean
        working-directory: app
        run: |
          flutter clean
          flutter pub get

      # ===============================================================
      # BUILD APK
      # ===============================================================

      - name: Build split APKs
        working-directory: app
        env:
          ADMOB_BANNER: ${{ secrets.ADMOB_BANNER }}
          ADMOB_INTERSTITIAL: ${{ secrets.ADMOB_INTERSTITIAL }}
          ADMOB_REWARDED: ${{ secrets.ADMOB_REWARDED }}
          ADMOB_NATIVE: ${{ secrets.ADMOB_NATIVE }}
        run: |
          flutter build apk \
            --release \
            --split-per-abi \
            --dart-define=ADMOB_BANNER="$ADMOB_BANNER" \
            --dart-define=ADMOB_INTERSTITIAL="$ADMOB_INTERSTITIAL" \
            --dart-define=ADMOB_REWARDED="$ADMOB_REWARDED" \
            --dart-define=ADMOB_NATIVE="$ADMOB_NATIVE"

      # ===============================================================
      # BUILD AAB
      # ===============================================================

      - name: Build App Bundle
        if: ${{ github.event_name == 'push' || inputs.build_aab }}
        working-directory: app
        env:
          ADMOB_BANNER: ${{ secrets.ADMOB_BANNER }}
          ADMOB_INTERSTITIAL: ${{ secrets.ADMOB_INTERSTITIAL }}
          ADMOB_REWARDED: ${{ secrets.ADMOB_REWARDED }}
          ADMOB_NATIVE: ${{ secrets.ADMOB_NATIVE }}
        run: |
          flutter build appbundle \
            --release \
            --dart-define=ADMOB_BANNER="$ADMOB_BANNER" \
            --dart-define=ADMOB_INTERSTITIAL="$ADMOB_INTERSTITIAL" \
            --dart-define=ADMOB_REWARDED="$ADMOB_REWARDED" \
            --dart-define=ADMOB_NATIVE="$ADMOB_NATIVE"

      # ===============================================================
      # SIZE REPORT
      # ===============================================================

      - name: Generate size report
        working-directory: app
        run: |
          {
            echo "## Artifact sizes"
            echo ""

            for f in \
              build/app/outputs/flutter-apk/*-release.apk \
              build/app/outputs/bundle/release/*.aab
            do
              [ -f "$f" ] || continue

              size=$(stat -c%s "$f")

              echo "- \`$(basename "$f")\` — $((size / 1024 / 1024)) MB"
            done

          } >> "$GITHUB_STEP_SUMMARY"

      # ===============================================================
      # CREATE / UPDATE GITHUB RELEASE
      # ===============================================================

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --generate-notes \
            2>/dev/null || true

      # ===============================================================
      # UPLOAD APK / AAB TO RELEASE
      # ===============================================================

      - name: Attach Android artifacts to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            --clobber \
            app/build/app/outputs/flutter-apk/*-release.apk \
            app/build/app/outputs/bundle/release/*.aab

      # ===============================================================
      # GITHUB ACTIONS ARTIFACTS
      # ===============================================================

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            app/build/app/outputs/flutter-apk/*-release.apk
            app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

      # ===============================================================
      # CLEANUP
      # ===============================================================

      - name: Remove signing files
        if: always()
        run: |
          rm -f app/android/app/upload-keystore.jks
          rm -f app/android/key.properties

          echo "Signing files removed."