name: indian_food_calories
description: Offline-first Indian food calorie and nutrition tracker.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.17.0"

dependencies:
  flutter:
    sdk: flutter

  # state + navigation
  provider: ^6.1.2
  go_router: ^14.2.0

  # storage
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  archive: ^3.6.1

  # images
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.2

  # monetisation
  google_mobile_ads: ^9.1.0

  # features
  mobile_scanner: ^5.1.1
  speech_to_text: ^7.4.0
  fl_chart: ^0.68.0
  pdf: ^3.11.0
  printing: ^5.13.0
  share_plus: ^12.0.2
  http: ^1.2.1
  intl: ^0.19.0
  package_info_plus: ^8.0.0
  crypto: ^3.0.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Floor is 2.4.0, not 2.3.3, on purpose. 2.3.x imports
  # `package:sqlite3/open.dart`, which sqlite3 removed in 3.x, while still
  # declaring `sqlite3: >=2.3.0 <4.0.0` — so pub is free to resolve a pair
  # that cannot compile, and the FFI database tests fail to load with
  # "No such file or directory: .../sqlite3-3.x/lib/open.dart".
  sqflite_common_ffi: ^2.4.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/db/
    - assets/config/
